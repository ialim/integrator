services:
  app:
    build:
      context: docker/php
    image: integrator-php:8.4
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: pgsql
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      pgsql:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  pgsql:
    image: postgres:17
    environment:
      POSTGRES_DB: integrator
      POSTGRES_USER: integrator
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
      - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrator -d integrator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgsql-data:
