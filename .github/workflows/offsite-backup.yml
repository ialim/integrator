# The hourly offsite copy (NFR-5, AD-20), run outside Laravel Cloud by the
# owner's decision of 25 October 2026. Every value comes from GitHub's secret
# store by name; see docs/operations/laravel-cloud.md and alerts.md.
#
# Scheduled runs happen only once the repository variable
# OFFSITE_BACKUP_ENABLED is `true` (set it after the secrets are in place);
# a manual run always goes ahead. GitHub may start a scheduled run late; the
# heartbeat monitor's 70-minute grace covers that.
name: Offsite backup

on:
  schedule:
    - cron: '7 * * * *' # minute 7 of every hour, away from the top-of-hour rush
  workflow_dispatch:

concurrency:
  group: offsite-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted dump and object copy to the offsite bucket
    if: github.event_name == 'workflow_dispatch' || vars.OFFSITE_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BACKUP_STEP_FILE: /tmp/offsite-backup-step
    steps:
      - uses: actions/checkout@v4

      - name: Install pg_dump 17, age and rclone
        run: |
          echo "install tools" > "$BACKUP_STEP_FILE"
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17 age rclone
          /usr/lib/postgresql/17/bin/pg_dump --version
          age --version
          rclone --version | head -n1

      - name: Back up
        # Bounds pg_dump and the uploads, and leaves the job time to report.
        timeout-minutes: 35
        env:
          PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
          OFFSITE_S3_ENDPOINT: ${{ secrets.OFFSITE_S3_ENDPOINT }}
          OFFSITE_S3_REGION: ${{ secrets.OFFSITE_S3_REGION }}
          OFFSITE_S3_BUCKET: ${{ secrets.OFFSITE_S3_BUCKET }}
          OFFSITE_S3_PREFIX: ${{ secrets.OFFSITE_S3_PREFIX }}
          OFFSITE_S3_ACCESS_KEY_ID: ${{ secrets.OFFSITE_S3_ACCESS_KEY_ID }}
          OFFSITE_S3_SECRET_ACCESS_KEY: ${{ secrets.OFFSITE_S3_SECRET_ACCESS_KEY }}
          SOURCE_S3_ENDPOINT: ${{ secrets.SOURCE_S3_ENDPOINT }}
          SOURCE_S3_REGION: ${{ secrets.SOURCE_S3_REGION }}
          SOURCE_S3_BUCKET: ${{ secrets.SOURCE_S3_BUCKET }}
          SOURCE_S3_ACCESS_KEY_ID: ${{ secrets.SOURCE_S3_ACCESS_KEY_ID }}
          SOURCE_S3_SECRET_ACCESS_KEY: ${{ secrets.SOURCE_S3_SECRET_ACCESS_KEY }}
        run: bash scripts/ops/backup.sh

      # The monitor emails the founder "Backup failed" with this body, also when
      # the backup step timed out or the run was cancelled. A copy that never
      # arrives at all is caught by the monitor's own 70-minute grace.
      - name: Tell the heartbeat monitor the backup failed
        if: failure() || cancelled()
        env:
          BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BACKUP_HEARTBEAT_URL" ]; then
            echo "No heartbeat URL set; nothing to tell."
            exit 0
          fi
          step="$(cat "$BACKUP_STEP_FILE" 2>/dev/null || echo 'start the job')"
          utc="$(date -u '+%d %B %Y, %H:%M UTC')"
          wat="$(TZ=Africa/Lagos date '+%d %B %Y, %H:%M WAT')"
          body="Backup failed at step: ${step}. When: ${wat} (${utc}). Run: ${RUN_URL}"
          echo "$body"
          curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "$body" "${BACKUP_HEARTBEAT_URL%/}/fail"
